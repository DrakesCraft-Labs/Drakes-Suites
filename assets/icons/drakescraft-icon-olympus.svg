<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="30%" stop-color="#E5B342"/>
      <stop offset="70%" stop-color="#B37D14"/>
      <stop offset="100%" stop-color="#784E04"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99326"/>
      <stop offset="50%" stop-color="#FCE082"/>
      <stop offset="100%" stop-color="#FFECA8"/>
    </linearGradient>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0E3D"/>
      <stop offset="50%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDE9F2"/>
      <stop offset="100%" stop-color="#C8C2D4"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="mahoragaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#9333EA" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#581C87" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Clip Path for Rounded Square Icon -->
    <clipPath id="iconClip">
      <rect x="8" y="8" width="496" height="496" rx="105" ry="105"/>
    </clipPath>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes spinClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes spinCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      @keyframes pulseAura { 0%, 100% { opacity: 0.6; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes cyberPulse { 0%, 100% { stroke-opacity: 0.7; filter: drop-shadow(0 0 2px #06B6D4); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #67E8F9); } }
      @keyframes starFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

      .gear-tl { transform-origin: 55px 55px; animation: spinClockwise 24s linear infinite; }
      .gear-tr { transform-origin: 457px 55px; animation: spinCounter 24s linear infinite; }
      .gear-bl { transform-origin: 55px 457px; animation: spinCounter 24s linear infinite; }
      .gear-br { transform-origin: 457px 457px; animation: spinClockwise 24s linear infinite; }
      .mahoraga-wheel { transform-origin: 256px 190px; animation: spinClockwise 45s linear infinite; }
      .divine-aura { transform-origin: 256px 190px; animation: pulseAura 4s ease-in-out infinite; }
      .cyber-circuit { animation: cyberPulse 2.5s ease-in-out infinite; }
      .dragon-float { animation: starFloat 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Rounded Square Container -->
  <g clip-path="url(#iconClip)">
    <!-- Deep Cosmic Purple Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#purpleBg)"/>

    <!-- Subtle Tech Hex Grid in Background -->
    <g opacity="0.12" stroke="#A855F7" stroke-width="1" fill="none">
      <polygon points="256,70 286,87 286,122 256,139 226,122 226,87"/>
      <polygon points="196,105 226,122 226,157 196,174 166,157 166,122"/>
      <polygon points="316,105 346,122 346,157 316,174 286,157 286,122"/>
      <polygon points="256,140 286,157 286,192 256,209 226,192 226,157"/>
      <polygon points="136,140 166,157 166,192 136,209 106,192 106,157"/>
      <polygon points="376,140 406,157 406,192 376,209 346,192 346,157"/>
    </g>

    <!-- Corner Steampunk / Cyber Gears -->
    <!-- Top-Left Gear -->
    <g class="gear-tl" opacity="0.75" fill="none" stroke="url(#goldGrad)" stroke-width="2.5">
      <circle cx="55" cy="55" r="34" stroke-dasharray="6,4" stroke-width="6"/>
      <circle cx="55" cy="55" r="26" stroke-width="2"/>
      <circle cx="55" cy="55" r="12" fill="url(#goldGrad)"/>
      <line x1="55" y1="20" x2="55" y2="90"/>
      <line x1="20" y1="55" x2="90" y2="55"/>
      <line x1="30" y1="30" x2="80" y2="80"/>
      <line x1="30" y1="80" x2="80" y2="30"/>
    </g>
    <!-- Top-Right Gear -->
    <g class="gear-tr" opacity="0.75" fill="none" stroke="url(#goldGrad)" stroke-width="2.5">
      <circle cx="457" cy="55" r="34" stroke-dasharray="6,4" stroke-width="6"/>
      <circle cx="457" cy="55" r="26" stroke-width="2"/>
      <circle cx="457" cy="55" r="12" fill="url(#goldGrad)"/>
      <line x1="457" y1="20" x2="457" y2="90"/>
      <line x1="422" y1="55" x2="492" y2="55"/>
      <line x1="432" y1="30" x2="482" y2="80"/>
      <line x1="432" y1="80" x2="482" y2="30"/>
    </g>
    <!-- Bottom-Left Gear -->
    <g class="gear-bl" opacity="0.75" fill="none" stroke="url(#goldGrad)" stroke-width="2.5">
      <circle cx="55" cy="457" r="34" stroke-dasharray="6,4" stroke-width="6"/>
      <circle cx="55" cy="457" r="26" stroke-width="2"/>
      <circle cx="55" cy="457" r="12" fill="url(#goldGrad)"/>
      <line x1="55" y1="422" x2="55" y2="492"/>
      <line x1="20" y1="457" x2="90" y2="457"/>
    </g>
    <!-- Bottom-Right Gear -->
    <g class="gear-br" opacity="0.75" fill="none" stroke="url(#goldGrad)" stroke-width="2.5">
      <circle cx="457" cy="457" r="34" stroke-dasharray="6,4" stroke-width="6"/>
      <circle cx="457" cy="457" r="26" stroke-width="2"/>
      <circle cx="457" cy="457" r="12" fill="url(#goldGrad)"/>
      <line x1="457" y1="422" x2="457" y2="492"/>
      <line x1="422" y1="457" x2="492" y2="457"/>
    </g>

    <!-- Circular Gold Frame with Meander Outer Track -->
    <circle cx="256" cy="235" r="205" fill="#180A2E" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)"/>
    <circle cx="256" cy="235" r="185" fill="#0D041A" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8,6,3,6" opacity="0.85"/>
    <!-- Greek Meander Frieze Inner Ring (Abstract Geometric Pattern) -->
    <circle cx="256" cy="235" r="172" fill="none" stroke="url(#goldLight)" stroke-width="5" stroke-dasharray="12,8,4,8" opacity="0.7"/>

    <!-- Mahoraga Divine Wheel of Adaptation (Aura & Spoked Wheel) -->
    <circle class="divine-aura" cx="256" cy="190" r="140" fill="url(#mahoragaAura)"/>
    
    <g class="mahoraga-wheel" filter="url(#glow)">
      <!-- Outer Wheel Rim with Inscribed Runes -->
      <circle cx="256" cy="190" r="105" fill="none" stroke="url(#goldLight)" stroke-width="5"/>
      <circle cx="256" cy="190" r="95" fill="none" stroke="#D8B4FE" stroke-width="2" stroke-dasharray="6,4"/>
      <circle cx="256" cy="190" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <circle cx="256" cy="190" r="14" fill="url(#goldLight)"/>
      
      <!-- 8 Dharmachakra / Mahoraga Spikes -->
      <path d="M256,85 L263,154 L256,158 L249,154 Z" fill="url(#goldLight)"/>
      <path d="M256,295 L263,226 L256,222 L249,226 Z" fill="url(#goldLight)"/>
      <path d="M151,190 L220,197 L224,190 L220,183 Z" fill="url(#goldLight)"/>
      <path d="M361,190 L292,197 L288,190 L292,183 Z" fill="url(#goldLight)"/>
      <path d="M182,116 L231,165 L228,170 L223,167 Z" fill="url(#goldLight)"/>
      <path d="M330,264 L281,215 L284,210 L289,213 Z" fill="url(#goldLight)"/>
      <path d="M182,264 L231,215 L228,210 L223,213 Z" fill="url(#goldLight)"/>
      <path d="M330,116 L281,165 L284,170 L289,167 Z" fill="url(#goldLight)"/>
    </g>

    <!-- Classical Olympus Greek Temple (Marble Architecture) -->
    <g id="temple" filter="url(#dropShadow)">
      <!-- Temple Pediment / Triangular Roof -->
      <polygon points="110,135 256,65 402,135" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
      <!-- Inner Tympanum Sculpture Relief Frame -->
      <polygon points="130,130 256,76 382,130" fill="#1B1229" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <!-- Pediment Central Crest: Mythic Greek Sun -->
      <circle cx="256" cy="110" r="11" fill="url(#goldLight)"/>
      <line x1="256" y1="94" x2="256" y2="126" stroke="url(#goldLight)" stroke-width="2"/>
      <line x1="240" y1="110" x2="272" y2="110" stroke="url(#goldLight)" stroke-width="2"/>
      
      <!-- Architrave / Beam -->
      <rect x="104" y="135" width="304" height="16" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
      <line x1="110" y1="143" x2="402" y2="143" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,3"/>
      
      <!-- Left Column (Ionic Style Fluted Column) -->
      <!-- Capital -->
      <rect x="116" y="151" width="46" height="10" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="123" cy="156" r="4" fill="url(#goldLight)"/>
      <circle cx="155" cy="156" r="4" fill="url(#goldLight)"/>
      <!-- Shaft -->
      <rect x="122" y="161" width="34" height="185" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <line x1="129" y1="161" x2="129" y2="346" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="136" y1="161" x2="136" y2="346" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="143" y1="161" x2="143" y2="346" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="150" y1="161" x2="150" y2="346" stroke="#6B7280" stroke-width="1.5"/>
      <!-- Base -->
      <rect x="116" y="346" width="46" height="12" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

      <!-- Right Column (Ionic Style Fluted Column) -->
      <!-- Capital -->
      <rect x="350" y="151" width="46" height="10" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="357" cy="156" r="4" fill="url(#goldLight)"/>
      <circle cx="389" cy="156" r="4" fill="url(#goldLight)"/>
      <!-- Shaft -->
      <rect x="356" y="161" width="34" height="185" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <line x1="363" y1="161" x2="363" y2="346" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="370" y1="161" x2="370" y2="346" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="377" y1="161" x2="377" y2="346" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="384" y1="161" x2="384" y2="346" stroke="#6B7280" stroke-width="1.5"/>
      <!-- Base -->
      <rect x="350" y="346" width="46" height="12" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

      <!-- Temple Floor / Stylobate Platform -->
      <rect x="94" y="358" width="324" height="16" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
      <rect x="80" y="374" width="352" height="14" rx="2" fill="url(#marbleGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>

    <!-- The Great Golden Drake (Serpentine Cyber-Greek Dragon) -->
    <g class="dragon-float" filter="url(#dropShadow)">
      <!-- Serpentine Body 'S' Curve Layer 1: Underbelly Scales -->
      <path d="M265,130 C230,135 205,160 215,200 C225,240 290,260 305,300 C320,340 270,380 220,375 C185,370 170,335 185,305 C195,285 220,290 220,310 C220,325 205,335 220,345 C240,355 265,335 260,305 C255,275 195,245 180,205 C165,165 200,125 250,115 Z" 
            fill="url(#goldGrad)" stroke="#5C3A00" stroke-width="3"/>

      <!-- Main Scaled Spine Structure -->
      <path d="M275,135 C245,140 225,165 235,195 C245,225 300,245 315,285 C330,325 285,365 235,360 C205,355 190,325 205,295 C212,280 230,285 230,300 C230,315 218,325 230,335 C245,345 268,325 262,300 C256,275 210,245 198,210 C185,175 215,135 260,125 Z" 
            fill="url(#goldLight)" stroke="url(#goldGrad)" stroke-width="2"/>

      <!-- Segmented Metallic Dragon Plates (Dorsal Spine Ridges) -->
      <path d="M230,145 L220,135 L228,155 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M218,170 L205,165 L218,182 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M218,198 L202,198 L220,212 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M245,230 L235,238 L255,245 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M280,255 L292,248 L285,268 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M312,285 L328,280 L315,302 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M315,320 L330,325 L310,338 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      <path d="M280,360 L288,375 L268,368 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>

      <!-- Dragon Head (Imperial Celestial Horns, Brow & Jaws) -->
      <!-- Crown Horns -->
      <path d="M260,120 C250,90 270,60 305,50 C290,75 295,95 280,115 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="2"/>
      <path d="M275,115 C285,85 315,65 345,60 C325,85 320,105 295,120 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="2"/>
      <path d="M290,125 C310,110 335,100 355,105 C335,120 325,130 305,135 Z" fill="url(#goldLight)" stroke="#4A2E00" stroke-width="1.5"/>
      
      <!-- Head Base & Snout -->
      <path d="M255,125 C265,115 295,115 315,130 C335,145 350,140 365,145 C355,160 330,165 310,162 C295,175 270,175 255,155 Z" 
            fill="url(#goldLight)" stroke="#5C3A00" stroke-width="2.5"/>
      <!-- Lower Jaw -->
      <path d="M290,165 C315,168 335,178 345,170 C330,182 305,182 285,175 Z" fill="url(#goldGrad)" stroke="#5C3A00" stroke-width="2"/>
      
      <!-- Glowing Cyan Dragon Eye -->
      <polygon points="308,135 324,138 316,145 304,142" fill="#FFFFFF" filter="url(#glow)"/>
      <polygon points="310,136 322,139 315,144 306,142" fill="url(#cyanGlow)"/>

      <!-- Glowing Cyan Cyber Circuits / Tachyon Traces along scales -->
      <g class="cyber-circuit" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- Head circuit -->
        <polyline points="278,122 292,126 304,122"/>
        <circle cx="304" cy="122" r="2.5" fill="#67E8F9"/>
        
        <!-- Neck circuits -->
        <path d="M260,138 Q240,160 238,190"/>
        <circle cx="238" cy="190" r="3" fill="#67E8F9"/>
        <polyline points="238,190 250,205 250,225"/>
        <circle cx="250" cy="225" r="3" fill="#67E8F9"/>
        
        <!-- Mid-body circuits -->
        <path d="M250,225 Q285,245 295,275"/>
        <circle cx="295" cy="275" r="3" fill="#67E8F9"/>
        <polyline points="295,275 308,290 300,315"/>
        <circle cx="300" cy="315" r="3" fill="#67E8F9"/>

        <!-- Tail spiral circuits -->
        <path d="M300,315 Q290,345 255,348"/>
        <polyline points="255,348 235,340 220,315"/>
        <circle cx="220" cy="315" r="3" fill="#67E8F9"/>
        <polyline points="220,315 210,325 210,335"/>
        <circle cx="210" cy="335" r="2.5" fill="#67E8F9"/>
      </g>
    </g>

    <!-- Monumental Curved Golden Ribbon & Typography 'DrakesCraft' -->
    <g id="banner" filter="url(#dropShadow)">
      <!-- Ribbon Shadow/Fold Left -->
      <polygon points="32,440 85,395 85,450 32,475" fill="#5A3B05" stroke="#331E00" stroke-width="2"/>
      <!-- Ribbon Shadow/Fold Right -->
      <polygon points="480,440 427,395 427,450 480,475" fill="#5A3B05" stroke="#331E00" stroke-width="2"/>

      <!-- Main Ribbon Body -->
      <path d="M60,405 C180,385 332,385 452,405 L442,460 C322,442 190,442 70,460 Z" 
            fill="url(#goldGrad)" stroke="#FFE899" stroke-width="2.5"/>
      <!-- Inner Inset Line on Ribbon -->
      <path d="M75,414 C190,396 322,396 437,414" fill="none" stroke="#784E04" stroke-width="1.5"/>
      <path d="M82,450 C195,433 317,433 430,450" fill="none" stroke="#784E04" stroke-width="1.5"/>

      <!-- 3D Chiseled Text: DRAKESCRAFT -->
      <text x="256" y="440" 
            font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="3" 
            text-anchor="middle" 
            fill="#1A0B2E" 
            filter="drop-shadow(0 2px 0px #FFF3B8)">
        DRAKESCRAFT
      </text>
      <text x="256" y="438" 
            font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="3" 
            text-anchor="middle" 
            fill="url(#purpleBg)">
        DRAKESCRAFT
      </text>
    </g>

    <!-- Outer Gold Bezel / App Icon Border -->
    <rect x="8" y="8" width="496" height="496" rx="105" ry="105" fill="none" stroke="url(#goldLight)" stroke-width="14" filter="url(#dropShadow)"/>
    <rect x="18" y="18" width="476" height="476" rx="95" ry="95" fill="none" stroke="#5C3A00" stroke-width="2"/>
  </g>
</svg>