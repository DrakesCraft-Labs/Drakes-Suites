<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="aegisDark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="spartanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="crimsonFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="aegisSkin" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="64" fill="#09090b"/>

  <!-- SPARTAN AEGIS ROUND SHIELD -->
  <g transform="translate(256, 215)">
    <!-- Outer Shield Rim -->
    <circle r="195" fill="none" stroke="url(#spartanGold)" stroke-width="12"/>
    <circle r="183" fill="#18181b" stroke="#78350f" stroke-width="3"/>
    
    <!-- Greek Key / Meander Circumference Ring -->
    <circle r="170" fill="url(#aegisDark)" stroke="url(#spartanGold)" stroke-width="2" stroke-dasharray="10 6"/>

    <!-- Radiant Solar Flares / Battle Marks -->
    <g stroke="url(#crimsonFire)" stroke-width="3" opacity="0.4">
      <line x1="-120" y1="-120" x2="-80" y2="-80"/>
      <line x1="120" y1="-120" x2="80" y2="-80"/>
      <line x1="-120" y1="120" x2="-80" y2="80"/>
      <line x1="120" y1="120" x2="80" y2="80"/>
    </g>
  </g>

  <!-- PROUD ANATOMICALLY SHARP ROARING DRAGON (3/4 Profile Facing Forward-Right) -->
  <g id="dragon-aegis" transform="translate(25, -5)">
    <!-- Massive Sweeping Horns -->
    <path d="M210 120 C150 40 70 30 25 50 C65 65 130 100 170 160 Z" 
          fill="url(#spartanGold)" stroke="#78350f" stroke-width="2"/>
    <path d="M210 120 C165 55 105 45 55 58 C90 75 140 105 175 155 Z" fill="#fef08a" opacity="0.65"/>
    
    <!-- Secondary Lower Horn -->
    <path d="M180 180 C125 150 80 160 45 180 C80 185 125 190 155 205 Z" fill="url(#crimsonFire)"/>

    <!-- Dorsal Neck Armor Scales -->
    <path d="M125 210 L85 240 L120 255 L80 290 L115 310 L75 355 L135 385 L180 415 L245 425 L215 350 L180 290 L150 230 Z" 
          fill="url(#aegisSkin)" stroke="url(#spartanGold)" stroke-width="2"/>
    
    <!-- Red Scale Plates on Neck -->
    <polygon points="85,240 55,230 105,250" fill="url(#crimsonFire)"/>
    <polygon points="80,290 45,285 95,305" fill="url(#crimsonFire)"/>
    <polygon points="75,355 40,350 90,365" fill="url(#crimsonFire)"/>

    <!-- Main Head / Skull Box -->
    <path d="M185 155 C215 145 265 155 295 180 L365 210 C385 218 395 230 390 240 L355 252 L330 250 L300 265 L225 260 L185 220 Z" 
          fill="url(#aegisSkin)" stroke="url(#spartanGold)" stroke-width="2.5"/>

    <!-- Forehead Crimson Flame Streak -->
    <path d="M225 165 L290 185 L350 215 L320 225 L270 200 L220 180 Z" fill="url(#crimsonFire)" filter="url(#fireGlow)"/>

    <!-- Burning Golden Eye -->
    <polygon points="245,182 280,188 268,198 240,194" fill="#000000"/>
    <polygon points="248,184 276,189 266,196 244,193" fill="#f59e0b" filter="url(#fireGlow)"/>
    <polygon points="255,185 270,189 263,195 252,192" fill="#ffffff"/>
    <line x1="262" y1="185" x2="262" y2="195" stroke="#78350f" stroke-width="2"/>

    <!-- Snout & Nostril Flare -->
    <path d="M290 185 L365 210 L385 225 L350 230 L305 210 Z" fill="url(#spartanGold)" opacity="0.9"/>
    <ellipse cx="360" cy="222" rx="6" ry="3" transform="rotate(-15 360 222)" fill="#000000"/>
    <!-- Fire breath spark from nose -->
    <path d="M365 220 Q395 205 410 190 Q395 215 375 224 Z" fill="url(#crimsonFire)" filter="url(#fireGlow)"/>

    <!-- Fangs (Upper Jaw) -->
    <polygon points="325,248 332,265 338,248" fill="#ffffff"/>
    <polygon points="345,248 352,268 358,248" fill="#ffffff"/>
    <polygon points="368,245 375,260 380,242" fill="#ffffff"/>

    <!-- Roaring Fire Throat -->
    <path d="M295 262 Q345 275 405 270 Q345 295 285 282 Z" fill="url(#crimsonFire)" filter="url(#fireGlow)"/>
    <polygon points="305,270 345,268 335,275 375,272 330,282" fill="#fef08a"/>

    <!-- Lower Jaw & Beard Spikes -->
    <path d="M270 285 L320 282 L350 278 L335 295 L310 305 L255 300 L225 275 Z" 
          fill="url(#aegisSkin)" stroke="url(#spartanGold)" stroke-width="2"/>
    <polygon points="320,282 325,274 330,282" fill="#ffffff"/>
    <polygon points="338,280 343,272 348,278" fill="#ffffff"/>
    <!-- Chin Horn -->
    <polygon points="305,302 320,328 295,306" fill="url(#spartanGold)"/>
    <polygon points="275,300 285,320 265,302" fill="url(#spartanGold)"/>
  </g>

  <!-- BOTTOM PEDESTAL (Single Line "DrakesCraft") -->
  <g transform="translate(0, 405)">
    <!-- Backing Shadow -->
    <polygon points="40,32 70,5 442,5 472,32 442,60 70,60" fill="#000000" opacity="0.95"/>
    <!-- Foreground Bar -->
    <polygon points="45,32 72,8 440,8 467,32 440,57 72,57" fill="#18181b" 
             stroke="url(#spartanGold)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Spartan Red Inner Line -->
    <line x1="75" y1="52" x2="437" y2="52" stroke="url(#crimsonFire)" stroke-width="2"/>
    <polygon points="256,48 261,52 256,56 251,52" fill="#fef08a"/>

    <!-- TEXT: DRAKESCRAFT (SINGLE LINE, CLEAN & SOLID) -->
    <text x="256" y="41" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Palatino', 'Georgia', serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="5" 
          stroke-linejoin="round">DRAKESCRAFT</text>
    <text x="256" y="41" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Palatino', 'Georgia', serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#spartanGold)">DRAKESCRAFT</text>
  </g>
</svg>