<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dragonSkin" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dragonHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="plasmaGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Divine Sunburst Rays -->
  <g opacity="0.18">
    <path d="M256 220 L180 30 L256 60 Z" fill="url(#goldGrad)"/>
    <path d="M256 220 L332 30 L256 60 Z" fill="url(#goldGrad)"/>
    <path d="M256 220 L450 120 L400 170 Z" fill="url(#goldGrad)"/>
    <path d="M256 220 L62 120 L112 170 Z" fill="url(#goldGrad)"/>
    <path d="M256 220 L480 230 L450 280 Z" fill="url(#goldGrad)"/>
    <path d="M256 220 L32 230 L62 280 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="220" r="170" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  </g>

  <!-- Golden Outer Shield Frame -->
  <polygon points="256,22 470,110 470,350 256,488 42,350 42,110" 
           fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="256,36 454,118 454,342 256,470 58,342 58,118" 
           fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="14 7" opacity="0.6"/>

  <!-- Greek Key / Meander Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M80 120 h20 v-20 h-30 v30 h30"/>
    <path d="M432 120 h-20 v-20 h30 v30 h-30"/>
    <path d="M80 330 h20 v20 h-30 v-30 h30"/>
    <path d="M432 330 h-20 v20 h30 v-30 h-30"/>
  </g>

  <!-- DRAGON ANATOMY (Side Profile Facing Right, Regal & Menacing) -->
  <g id="dragon-olympus" transform="translate(10, -10)">
    <!-- Back Horn (Shadow layer) -->
    <path d="M190 125 C140 70 80 80 45 105 C75 105 120 125 155 160 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M210 100 C175 40 100 35 60 55 C95 65 150 85 185 130 Z" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Main Dorsal Neck & Crest Plates -->
    <path d="M130 220 L100 240 L125 260 L90 290 L120 310 L80 350 L140 375 L175 410 L256 425 L230 360 L200 300 L170 240 Z" 
          fill="url(#dragonSkin)" stroke="#4338ca" stroke-width="2"/>
    
    <!-- Golden Dorsal Spikes -->
    <polygon points="100,240 70,230 115,255" fill="url(#goldGrad)"/>
    <polygon points="90,290 55,285 105,305" fill="url(#goldGrad)"/>
    <polygon points="80,350 45,350 100,365" fill="url(#goldGrad)"/>
    <polygon points="140,375 105,395 155,405" fill="url(#goldGrad)"/>

    <!-- Neck Scales (Lorica Segmentata Style) -->
    <path d="M140 250 Q180 270 195 320 L165 330 Q150 280 125 260 Z" fill="url(#dragonHighlight)" opacity="0.6"/>
    <path d="M160 300 Q200 320 215 370 L185 380 Q170 330 145 310 Z" fill="url(#dragonHighlight)" opacity="0.6"/>

    <!-- Main Huge Horn (Foreground - Sweeping Regal Arch) -->
    <path d="M235 125 C190 30 110 20 65 35 C115 50 170 85 205 150 Z" 
          fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <path d="M235 125 C200 65 145 45 95 48 C135 68 180 100 215 155 Z" fill="#fef08a" opacity="0.7"/>

    <!-- Secondary Cheek Horn -->
    <path d="M210 190 C160 170 120 180 90 205 C125 205 165 208 195 220 Z" 
          fill="url(#goldGrad)"/>

    <!-- Dragon Head Base & Skull -->
    <path d="M205 145 C230 140 280 150 310 175 L385 205 C405 212 415 225 410 235 L380 248 L350 245 L320 260 L240 255 L205 220 Z" 
          fill="url(#dragonSkin)" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Brow Ridge & Snout Contours -->
    <path d="M255 160 L310 180 L375 210 L345 220 L295 195 L250 180 Z" fill="url(#dragonHighlight)"/>
    <path d="M310 180 L385 205 L405 220 L370 225 L325 205 Z" fill="url(#goldLight)" opacity="0.85"/>

    <!-- Nostril Flaring with Plasma Smoke -->
    <ellipse cx="378" cy="218" rx="7" ry="3.5" transform="rotate(-15 378 218)" fill="#090d16"/>
    <path d="M380 216 Q410 200 425 185 Q410 210 390 220 Z" fill="url(#plasmaGlow)" opacity="0.8" filter="url(#softGlow)"/>

    <!-- Piercing Amethyst / Divine Eye -->
    <polygon points="265,178 300,185 285,195 260,190" fill="#020617"/>
    <polygon points="268,180 295,186 283,193 264,189" fill="#c084fc" filter="url(#softGlow)"/>
    <polygon points="274,181 288,186 280,192 272,188" fill="#ffffff"/>
    <line x1="280" y1="181" x2="280" y2="192" stroke="#4c1d95" stroke-width="2.5"/>

    <!-- Upper Jaw & Razor Fangs -->
    <path d="M320 245 L345 245 L350 258 L360 246 L375 247 L382 262 L392 245 L408 240 L380 258 L345 265 L315 258 Z" 
          fill="#f8fafc" stroke="#64748b" stroke-width="1"/>

    <!-- Open Roaring Maw Interior & Lightning Flame -->
    <path d="M315 258 L375 260 C350 280 320 285 295 280 Z" fill="#581c87"/>
    <path d="M315 260 Q360 270 420 265 Q360 290 305 278 Z" fill="url(#plasmaGlow)" filter="url(#glow)" opacity="0.9"/>
    <!-- Lightning Bolt from Throat -->
    <polygon points="325,268 360,265 350,272 390,270 345,280 355,274" fill="#fef08a" filter="url(#softGlow)"/>

    <!-- Lower Jaw with Chin Horn & Spikes -->
    <path d="M290 282 L340 280 L370 275 L355 290 L330 300 L275 295 L245 270 L265 262 Z" 
          fill="url(#dragonSkin)" stroke="url(#goldGrad)" stroke-width="2"/>
    <polygon points="340,280 345,273 352,280" fill="#f8fafc"/>
    <polygon points="358,278 363,270 368,276" fill="#f8fafc"/>
    <polygon points="325,298 340,322 315,302" fill="url(#goldGrad)"/> <!-- Beard Horn -->
    <polygon points="295,295 305,315 285,298" fill="url(#goldGrad)"/>
  </g>

  <!-- BOTTOM TYPOGRAPHY PODIUM (Single Line "DrakesCraft") -->
  <g transform="translate(0, 400)">
    <!-- Base Plate Shadow & Backing -->
    <polygon points="40,35 70,5 442,5 472,35 442,65 70,65" fill="#020617" opacity="0.95"/>
    <polygon points="45,35 72,8 440,8 467,35 440,62 72,62" fill="url(#plateGrad)" 
             stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Corner Gem / Rivet Details -->
    <circle cx="75" cy="35" r="4" fill="url(#goldLight)"/>
    <circle cx="437" cy="35" r="4" fill="url(#goldLight)"/>

    <!-- Golden Underline Accent -->
    <path d="M90 52 L256 52 L422 52" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="256,48 262,52 256,56 250,52" fill="#fef08a"/>

    <!-- TEXT: DRAKESCRAFT (SINGLE LINE, CRISP, HIGH-IMPACT) -->
    <text x="256" y="42" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Palatino', 'Cinzel Decorative', 'Georgia', serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#020617" 
          stroke="#000000" 
          stroke-width="5" 
          stroke-linejoin="round">DRAKESCRAFT</text>
    <text x="256" y="42" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Palatino', 'Georgia', serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#goldLight)">DRAKESCRAFT</text>
  </g>
</svg>