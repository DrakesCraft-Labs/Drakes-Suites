<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" role="img" aria-label="StarSuites Animated Banner">
  <defs>
    <!-- Paleta Cósmica de Gradientes -->
    <linearGradient id="bgVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030B"/>
      <stop offset="25%" stop-color="#0B061A"/>
      <stop offset="55%" stop-color="#140A2E"/>
      <stop offset="85%" stop-color="#090E26"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <radialGradient id="nebulaViolet" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaGold" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="30%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filtros de Resplandor Óptico -->
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowFierce" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patrón de Malla Reticular Holográfica -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A78BFA" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>

    <!-- Animaciones CSS Puras -->
    <style>
      @keyframes pulseNebula {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.05); }
      }
      @keyframes twinkleA {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes twinkleB {
        0%, 100% { opacity: 0.9; transform: scale(1.2); }
        50% { opacity: 0.2; transform: scale(0.7); }
      }
      @keyframes twinkleC {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes rotateOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateOrbitRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes shimmerBorder {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      @keyframes starCoreBeat {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #F59E0B); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 24px #F43F5E); }
      }

      .anim-nebula-v { animation: pulseNebula 9s ease-in-out infinite; transform-origin: 540px 150px; }
      .anim-nebula-c { animation: pulseNebula 12s ease-in-out infinite reverse; transform-origin: 780px 210px; }
      .star-twinkle-1 { animation: twinkleA 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star-twinkle-2 { animation: twinkleB 4.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star-twinkle-3 { animation: twinkleC 2.5s ease-in-out infinite; }
      .orbit-spin { animation: rotateOrbit 30s linear infinite; transform-origin: 600px 125px; }
      .orbit-spin-rev { animation: rotateOrbitRev 45s linear infinite; transform-origin: 600px 125px; }
      .border-shimmer { animation: shimmerBorder 4s ease-in-out infinite; }
      .stellar-core { animation: starCoreBeat 3.5s ease-in-out infinite; transform-origin: 600px 125px; }
    </style>
  </defs>

  <!-- Fondo Profundo del Cosmos -->
  <rect width="1200" height="420" rx="20" fill="url(#bgVoid)"/>
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)"/>

  <!-- Nebulosas Estelares Pulsantes -->
  <g class="anim-nebula-v">
    <circle cx="520" cy="140" r="320" fill="url(#nebulaViolet)"/>
  </g>
  <g class="anim-nebula-c">
    <circle cx="720" cy="180" r="300" fill="url(#nebulaCyan)"/>
  </g>
  <circle cx="600" cy="125" r="220" fill="url(#nebulaGold)"/>

  <!-- Campo Estelar Animado (Estrellas Distantes y Brillantes) -->
  <g class="star-twinkle-1">
    <circle cx="95" cy="65" r="2.2" fill="#E0F2FE"/>
    <circle cx="180" cy="130" r="1.8" fill="#FDE68A"/>
    <circle cx="280" cy="45" r="2.5" fill="#DDD6FE"/>
    <circle cx="410" cy="95" r="1.5" fill="#BAE6FD"/>
    <circle cx="780" cy="55" r="2.8" fill="#FDE68A"/>
    <circle cx="920" cy="115" r="2.2" fill="#DDD6FE"/>
    <circle cx="1060" cy="70" r="2.6" fill="#BAE6FD"/>
    <circle cx="1120" cy="140" r="1.8" fill="#FDE68A"/>
    <circle cx="140" cy="310" r="2.2" fill="#E0F2FE"/>
    <circle cx="340" cy="360" r="1.8" fill="#FDE68A"/>
    <circle cx="880" cy="340" r="2.4" fill="#DDD6FE"/>
    <circle cx="1040" cy="300" r="2.0" fill="#E0F2FE"/>
  </g>

  <g class="star-twinkle-2">
    <circle cx="130" cy="85" r="1.6" fill="#FDE047"/>
    <circle cx="240" cy="180" r="2.2" fill="#38BDF8"/>
    <circle cx="350" cy="60" r="2.0" fill="#F472B6"/>
    <circle cx="850" cy="90" r="1.8" fill="#FDE047"/>
    <circle cx="980" cy="45" r="2.5" fill="#38BDF8"/>
    <circle cx="1090" cy="110" r="1.7" fill="#F472B6"/>
    <circle cx="80" cy="240" r="2.0" fill="#FDE047"/>
    <circle cx="220" cy="340" r="2.4" fill="#38BDF8"/>
    <circle cx="960" cy="360" r="1.9" fill="#38BDF8"/>
    <circle cx="1110" cy="250" r="2.1" fill="#FDE047"/>
  </g>

  <g class="star-twinkle-3">
    <!-- Destellos Estelares en Forma de Cruz de Luz -->
    <path d="M 210 75 L 210 89 M 203 82 L 217 82" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 1010 80 L 1010 94 M 1003 87 L 1017 87" stroke="#FDE047" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 160 210 L 160 220 M 155 215 L 165 215" stroke="#E879F9" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 1030 220 L 1030 230 M 1025 225 L 1035 225" stroke="#67E8F9" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Anillos Orbitales Centrales Giratorios -->
  <g class="orbit-spin">
    <ellipse cx="600" cy="125" rx="145" ry="50" fill="none" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="14 10" opacity="0.65"/>
    <circle cx="745" cy="125" r="4.5" fill="#06B6D4" filter="url(#glowSubtle)"/>
    <circle cx="455" cy="125" r="3.5" fill="#F59E0B" filter="url(#glowSubtle)"/>
  </g>
  <g class="orbit-spin-rev">
    <ellipse cx="600" cy="125" rx="110" ry="75" fill="none" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.55"/>
    <circle cx="600" cy="50" r="4" fill="#F43F5E" filter="url(#glowSubtle)"/>
    <circle cx="600" cy="200" r="3" fill="#A855F7" filter="url(#glowSubtle)"/>
  </g>

  <!-- Emblema de la Estrella Soberana (JackStar Core) -->
  <g class="stellar-core">
    <!-- Rayos de la Estrella de 8 Puntas -->
    <path d="M 600 70 L 608 117 L 655 125 L 608 133 L 600 180 L 592 133 L 545 125 L 592 117 Z"
          fill="url(#goldGrad)" filter="url(#glowSubtle)"/>
    <path d="M 600 88 L 605 120 L 637 125 L 605 130 L 600 162 L 595 130 L 563 125 L 595 120 Z"
          fill="#FFFFFF" opacity="0.8"/>
    <circle cx="600" cy="125" r="9" fill="#FFFBEB" filter="url(#glowFierce)"/>
  </g>

  <!-- Tipografía Principal: STARSUITES -->
  <g id="typography">
    <text x="600" y="240" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
          font-weight="900" font-size="52" fill="url(#textGrad)"
          letter-spacing="12" filter="url(#glowSubtle)">
      STARSUITES
    </text>

    <!-- Subtítulo Arquitectónico -->
    <text x="600" y="278" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="700" font-size="14.5" fill="#E2E8F0"
          letter-spacing="4.5" opacity="0.95">
      MONOREPO MASTER ARCHITECTURE · JACKSTAR SOVEREIGN ENGINE
    </text>

    <!-- Línea Divisoria Celestial -->
    <line x1="380" y1="298" x2="820" y2="298" stroke="url(#cardBorder)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="600" cy="298" r="3.5" fill="#F59E0B" filter="url(#glowSubtle)"/>
  </g>

  <!-- Badges / Píldoras de Tecnologías de Producción -->
  <g id="tech-badges" transform="translate(600, 345)">
    <!-- Badge 1: 8 Suites + Multiverse -->
    <g transform="translate(-430, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="17" fill="#111827" fill-opacity="0.85" stroke="#8B5CF6" stroke-width="1.4"/>
      <circle cx="-62" cy="0" r="4.5" fill="#A855F7" filter="url(#glowSubtle)"/>
      <text x="4" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#EDE9FE" letter-spacing="0.8">
        8 SUITES + MULTIVERSE
      </text>
    </g>

    <!-- Badge 2: Rust SIMD Engine -->
    <g transform="translate(-215, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="17" fill="#111827" fill-opacity="0.85" stroke="#F97316" stroke-width="1.4"/>
      <circle cx="-58" cy="0" r="4.5" fill="#FB923C" filter="url(#glowSubtle)"/>
      <text x="4" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFEDD5" letter-spacing="0.8">
        RUST SIMD OFF-HEAP
      </text>
    </g>

    <!-- Badge 3: SQLite WAL Engine -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-17" width="150" height="34" rx="17" fill="#111827" fill-opacity="0.85" stroke="#06B6D4" stroke-width="1.4"/>
      <circle cx="-54" cy="0" r="4.5" fill="#22D3EE" filter="url(#glowSubtle)"/>
      <text x="4" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ECFEFF" letter-spacing="0.8">
        SQLITE WAL ENGINE
      </text>
    </g>

    <!-- Badge 4: Paper 1.21.11 & 26.X -->
    <g transform="translate(215, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="17" fill="#111827" fill-opacity="0.85" stroke="#10B981" stroke-width="1.4"/>
      <circle cx="-58" cy="0" r="4.5" fill="#34D399" filter="url(#glowSubtle)"/>
      <text x="4" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ECFDF5" letter-spacing="0.8">
        PAPER 1.21.11 · 26.X
      </text>
    </g>

    <!-- Badge 5: SRE Triad Orchestrated -->
    <g transform="translate(430, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="17" fill="#111827" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1.4"/>
      <circle cx="-64" cy="0" r="4.5" fill="#FBBF24" filter="url(#glowSubtle)"/>
      <text x="4" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FEF3C7" letter-spacing="0.8">
        SRE TRIAD AUDITED
      </text>
    </g>
  </g>

  <!-- Marco Estelar Exterior Resplandeciente -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="2.5" class="border-shimmer"/>
  <rect x="7" y="7" width="1186" height="406" rx="14" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
</svg>
