# ==============================================================================
# 🏛️ DRAKES-SERVER: DISPLAY ENGINE (TAB & SCOREBOARD EMBEBIDOS)
# ==============================================================================
# Motor nativo de Adventure API embebido en Star Server.
# Modos de conmutación atómica según modalidad sin fugas ni sobrecarga de plugins externos.
# Recargable en caliente vía: /drakessuites reload server display

enabled: true

# Configuración del TAB (Header & Footer dinámicos)
tab:
  update-interval-ticks: 20 # 1 segundo
  header:
    - "<gradient:#f4c95d:#e1a120><bold>⚡ DRAKESCRAFT · STAR NETWORK ⚡</bold></gradient>"
    - "<gray>Cinco Modalidades · Engine 26.x Rust · Zero-Lag</gray>"
    - "<dark_gray>────────────────────────────────────────────</dark_gray>"
    - "<yellow>Modalidad Activa:</yellow> <white>%modality%</white> <dark_gray>·</dark_gray> <gray>Ping:</gray> <green>%player_ping%ms</green>"
  footer:
    - "<dark_gray>────────────────────────────────────────────</dark_gray>"
    - "<gray>Tienda VIP:</gray> <gold><bold>store.drakescraft.cl</bold></gold> <dark_gray>·</dark_gray> <gray>Discord:</gray> <aqua>discord.gg/rv3vtXZTk7</aqua>"
    - "<gray>En línea:</gray> <green>%server_online%</green> <dark_gray>/</dark_gray> <gray>TPS:</gray> <green>%server_tps%</green>"

# Configuración del Scoreboard Lateral por Modalidad
scoreboard:
  update-interval-ticks: 10 # 0.5 segundos
  title: "<gradient:#f4c95d:#d8b65a><bold>DRAKESCRAFT</bold></gradient>"

  modalities:
    slimefun:
      lines:
        - "<dark_gray>┌───────────────</dark_gray>"
        - "<gold>✦ Perfil:</gold> <white>%player_name%</white>"
        - "<gold>✦ Rango:</gold> <yellow>%vault_rank%</yellow>"
        - "<dark_gray>├───────────────</dark_gray>"
        - "<aqua>⚡ Slimefun SF:</aqua>"
        - "  <gray>Progreso:</gray> <green>%slimefun_researches%</green>"
        - "  <gray>Energía Red:</gray> <yellow>%slimefun_energy% J</yellow>"
        - "<dark_gray>├───────────────</dark_gray>"
        - "<green>✦ Dracmas:</green> <white>$%vault_eco_balance%</white>"
        - "<green>✦ Kills:</green> <white>%statistic_player_kills%</white>"
