  iron:
    required: 10000
    energy: 500000
  gold:
    required: 8000
    energy: 750000
  diamond:
    required: 4000
    energy: 1500000
  netherite:
    required: 1000
    energy: 5000000
  emerald:
    required: 3000
    energy: 1200000
  redstone:
    required: 12000
    energy: 600000
  lapis:
    required: 12000
    energy: 600000
  quartz:
    required: 8000
    energy: 800000
