# Armadura de Infinity & Defensas Cósmicas
infinity-armor:
  damage-reduction: 0.95
  anti-void: true
  god-true-damage-bypass: true # Canon AGENTS.md: Jefes divinos penetran invulnerabilidad

# Canteras Cuánticas & Minería del Vacío
quarries:
  max-blocks-per-tick: 8
  base-energy-per-block: 250
  chunk-protection: true
  max-per-chunk: 2

# Mecanismos Anti-Dupe
anti-dupe:
  strict-crafting-check: true
  log-suspicious-synthesis: true
